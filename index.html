<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E2A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Section Picker">
  <title>Section Picker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">Loading…</div>

  <script type="module">
    import { errors, blockPopoverHTML, STRINGS } from "./app.js";
    import { createBuilderState, builderHTML, wireBuilder, persist, picksToHash, comboFromPicks } from "./builder.js";

    // ---- language: toggle on the screen, persisted ----
    const savedLang = localStorage.getItem("lang");
    const state = { lang: savedLang === "ar" || savedLang === "en" ? savedLang : "en" };

    // ---- one screen: the builder. Picks live in the hash (shareable) and localStorage ----
    const hashPicks = () => (/^#build\/(.*)$/.exec(location.hash) || [])[1] || "";
    const b = createBuilderState(hashPicks());

    const app = document.getElementById("app");

    function applyDocLang() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    }
    applyDocLang();

    function bannerHTML() {
      const S = STRINGS[state.lang];
      if (!errors.length) return "";
      return `<div class="banner"><b>${S.problems(errors.length)}</b>
        <ul>${errors.map((e) => `<li>${e}</li>`).join("")}</ul></div>`;
    }

    function syncHash() {
      const h = picksToHash(b.picks);
      history.replaceState(null, "", h ? `#build/${h}` : "#build");
    }

    function render() {
      closeBlockPopover();
      const y = window.scrollY;
      app.innerHTML = bannerHTML() + builderHTML(b, state.lang);
      wireBuilder(app, b, handlers);
      syncHash();
      persist(b);
      window.scrollTo(0, y);
    }

    function setLang(lang) {
      if (lang === state.lang) return;
      state.lang = lang;
      localStorage.setItem("lang", lang);
      applyDocLang();
      render();
    }

    // §9 — printing always uses the Full week (labs included), whatever is toggled
    // on screen. The filename comes from document.title.
    function savePdf() {
      const originalView = b.view, originalTitle = document.title;
      if (b.view !== "withLabs") { b.view = "withLabs"; render(); }
      document.title = `Schedule-${picksToHash(b.picks).replace(/,/g, "_") || "MySchedule"}`;
      const restore = () => {
        document.title = originalTitle;
        if (b.view !== originalView) { b.view = originalView; render(); }
        window.removeEventListener("afterprint", restore);
      };
      window.addEventListener("afterprint", restore);
      window.print();
    }

    // ---- block detail popover (tap a block) ----
    function openBlockPopover(el) {
      closeBlockPopover();
      const info = {
        course: el.dataset.course, kind: el.dataset.kind, day: el.dataset.day,
        start: el.dataset.start, end: el.dataset.end,
        room: el.dataset.room, labCode: el.dataset.labCode, instructor: el.dataset.instructor,
      };
      const scrim = document.createElement("div");
      scrim.className = "popoverscrim";
      scrim.innerHTML = `<div class="blockpopover" role="dialog" aria-modal="true">${blockPopoverHTML(info, state.lang)}</div>`;
      document.body.appendChild(scrim);
      scrim.addEventListener("click", (e) => { if (e.target === scrim) closeBlockPopover(); });
      scrim.querySelector("[data-popover-close]")?.addEventListener("click", closeBlockPopover);
      document.addEventListener("keydown", onPopoverKeydown);
    }
    function onPopoverKeydown(e) { if (e.key === "Escape") closeBlockPopover(); }
    function closeBlockPopover() {
      document.querySelector(".popoverscrim")?.remove();
      document.removeEventListener("keydown", onPopoverKeydown);
    }

    const handlers = { rerender: render, setLang, openPopover: openBlockPopover, lang: () => state.lang, savePdf };

    // a pasted/shared link while the page is open
    window.addEventListener("hashchange", () => {
      if (hashPicks() === picksToHash(b.picks)) return;
      Object.assign(b, createBuilderState(hashPicks()));
      render();
    });

    render();

    // ---- installable PWA: offline after the first visit ----
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          nw?.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              const t = document.createElement("div");
              t.className = "updatetoast";
              t.innerHTML = `<span>${state.lang === "ar" ? "يوجد تحديث" : "Update available"}</span><button>${state.lang === "ar" ? "تحديث" : "Refresh"}</button>`;
              t.querySelector("button").onclick = () => location.reload();
              document.body.appendChild(t);
            }
          });
        });
      }).catch(() => { /* offline mode is a bonus, never fatal */ });
    }
  </script>
</body>
</html>
